# Builds the POS, Captain and Kitchen APKs and publishes them as a GitHub Release whenever the
# app changes on main. The in-app updater reads the latest release.
#
# Build number = run number + 100, so it always increases (and stays above the manually built
# 1.0.1+2). The version name comes from pubspec.yaml; bump that by hand for user-facing releases.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'third_party/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "Missing KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Work out version
        id: ver
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          CODE=$(( ${{ github.run_number }} + 100 ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME+$CODE" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build APKs
        run: |
          mkdir -p out
          for f in pos:main_pos captain:main_captain kitchen:main_kitchen; do
            flavor=${f%%:*}; target=${f##*:}
            flutter build apk --release --flavor "$flavor" -t "lib/$target.dart" \
              --build-name "${{ steps.ver.outputs.name }}" --build-number "${{ steps.ver.outputs.code }}"
            cp "build/app/outputs/flutter-apk/app-$flavor-release.apk" "out/bpos-$flavor.apk"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" out/bpos-*.apk \
            --title "BPOS ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})" \
            --generate-notes --target "${{ github.sha }}"
