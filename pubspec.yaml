name: bistro_pos
description: Restaurant POS (tablet) + Captain order-taking app (mobile).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  connectivity_plus: ^7.3.1
  drift: ^2.35.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqlite3: ^3.6.0
  unified_esc_pos_printer: ^3.4.0
flutter:
  uses-material-design: true
dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# usb_serial 0.5.2 (pulled in transitively by unified_esc_pos_printer for
# Android USB OTG support) ships an android/build.gradle that's incompatible
# with this project's AGP 9 / Gradle 9 toolchain (jcenter() + a per-module
# buildscript classpath). Overridden to a locally vendored, patched copy —
# see third_party/usb_serial/android/build.gradle for what changed.
dependency_overrides:
  usb_serial:
    path: third_party/usb_serial
