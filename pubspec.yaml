name: bistro_pos
description: Restaurant POS (tablet) + Captain order-taking app (mobile).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.6
  drift: ^2.35.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  mobile_scanner: ^7.4.2
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  sqlite3: ^3.6.0
  unified_esc_pos_printer: ^3.4.0
  wakelock_plus: ^1.8.0
  web_socket_channel: ^3.0.3
flutter:
  uses-material-design: true
dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# usb_serial 0.5.2 (pulled in transitively by unified_esc_pos_printer for
# Android USB OTG support) ships an android/build.gradle that's incompatible
# with this project's AGP 9 / Gradle 9 toolchain (jcenter() + a per-module
# buildscript classpath), and separately declares a compileSdkVersion below
# what its own androidx dependencies require. Overridden to a locally
# vendored, patched copy — see third_party/usb_serial/android/build.gradle.
#
# unified_esc_pos_printer 3.4.0 itself declares compileSdk 34, which is below
# what its own network_info_plus dependency (8.2.1) requires (36+). Overridden
# to a locally vendored copy with only that one line changed — see
# third_party/unified_esc_pos_printer/android/build.gradle.kts.
#
# network_info_plus is pinned here too: adding flutter_secure_storage otherwise
# lets the resolver settle on 7.0.0, whose Android plugin class layout doesn't
# match what GeneratedPluginRegistrant expects (build fails with
# "cannot find symbol NetworkInfoPlusPlugin"). 8.2.1 is the version the
# compileSdk-36 pin above was written for.
dependency_overrides:
  usb_serial:
    path: third_party/usb_serial
  unified_esc_pos_printer:
    path: third_party/unified_esc_pos_printer
  network_info_plus: ^8.2.1
